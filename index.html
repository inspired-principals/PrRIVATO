<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>URBAN MINDS // PRIVATO // ARCHITECTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-heading: 'Anton', sans-serif;
        --font-body: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --font-ai: 'Montserrat', sans-serif;
        
        --color-lux-gold: #FF7F32; 
        --color-lux-gold-dim: #D44100;
        --color-lux-platinum: #EAEAEA;
        --color-obsidian: #141414; 
        --color-void: #000000;
        
        --card-radius: 4px;
        --ease-lux: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        cursor: none !important;
      }

      ::selection {
        background: var(--color-lux-gold);
        color: #000;
        text-shadow: none;
      }

      body {
        font-family: var(--font-body);
        background-color: var(--color-void);
        color: var(--color-lux-platinum);
        overflow-x: hidden;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
        line-height: 1.5;
      }

      /* CINEMATIC POST-PROCESSING LAYERS */
      
      .film-grain {
        position: fixed;
        inset: 0;
        z-index: 9997;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.03;
        mix-blend-mode: overlay;
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 9998;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      }
      
      .crt-scanlines {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.01), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.01));
        background-size: 100% 3px, 3px 100%;
        opacity: 0.02;
      }

      /* ENHANCED OBSIDIAN MATERIAL SYSTEM */
      .obsidian-slab {
        background: #080808;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: var(--card-radius);
        box-shadow: 
          /* Deep Ambient Base */
          0 100px 150px -50px rgba(0, 0, 0, 1),
          /* Mid-range Structural Shadow */
          0 50px 100px -30px rgba(0, 0, 0, 0.9),
          /* Close Contact Shadow */
          0 10px 25px -5px rgba(0, 0, 0, 0.8),
          /* Atmospheric Glow */
          0 0 0 1px rgba(255, 255, 255, 0.05),
          /* Top Rim "Caught Light" Highlight */
          inset 0 1.5px 0 0 rgba(255, 255, 255, 0.45),
          /* Volume Highlight (Broad) */
          inset 0 8px 16px -8px rgba(255, 255, 255, 0.15),
          /* Bottom Gold Reflection */
          inset 0 -1.5px 0 0 rgba(255, 127, 50, 0.3),
          /* Internal Cavity Depth */
          inset 0 0 80px rgba(0, 0, 0, 0.98);
        transition: transform 0.8s var(--ease-lux), box-shadow 0.8s var(--ease-lux), border-color 0.8s var(--ease-lux);
      }

      .obsidian-slab:hover {
        border-color: rgba(255, 127, 50, 0.4);
        box-shadow: 
          0 120px 200px -60px rgba(0, 0, 0, 1),
          0 60px 120px -40px rgba(0, 0, 0, 0.95),
          0 20px 40px -10px rgba(255, 127, 50, 0.1),
          inset 0 2px 0 0 rgba(255, 255, 255, 0.6),
          inset 0 0 100px rgba(0, 0, 0, 0.95);
      }

      /* KINETIC REVEAL CLASSES */
      .kinetic-frame {
        opacity: 0;
        filter: blur(15px);
        transform: translateY(40px) scale(0.98);
        transition: opacity 1.4s var(--ease-lux), filter 1.4s var(--ease-lux), transform 1.4s var(--ease-lux);
      }

      .kinetic-frame.is-visible {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }

      /* PRECISION SCROLLBAR */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #222; border: 1px solid #000; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-lux-gold); }

      /* TEXT FX */
      .shimmer-gold {
        background: linear-gradient(90deg, #b07e5e 0%, var(--color-lux-gold) 50%, #b07e5e 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 4s linear infinite;
      }

      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }

      @keyframes routeSweep {
        0% { transform: translateY(-100%); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(100%); opacity: 0; }
      }

      @keyframes border-draw {
        0% { clip-path: inset(0 0 99% 0); }
        25% { clip-path: inset(0 99% 0 0); }
        50% { clip-path: inset(99% 0 0 0); }
        75% { clip-path: inset(0 0 0 99%); }
        100% { clip-path: inset(0 0 99% 0); }
      }

      @keyframes holoScan {
        0% { transform: translateY(-100%); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(200%); opacity: 0; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body>
    <div id="route-sweep" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(to bottom, transparent, var(--color-lux-gold), transparent);height:200vh;pointer-events:none;opacity:0;"></div>
    <div class="film-grain"></div>
    <div class="vignette"></div>
    <div class="crt-scanlines"></div>
    <div id="root"></div>
  </body>
</html>
